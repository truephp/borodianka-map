name: Import OSM data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Import validated boundary, roads and buildings
        run: node scripts/fetch-osm.mjs
      - name: Commit updated geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boundary.geojson data/roads.geojson data/buildings.geojson data/address-points.geojson
          if ! git diff --cached --quiet; then
            git commit -m "data: update Borodianka boundary, streets and buildings"
            git push
          fi
