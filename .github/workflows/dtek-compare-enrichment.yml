name: Compare DTEK matching quality
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dtek-compare-enrichment.yml'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47' 'shapely>=2,<3'
      - name: Compare results
        run: python scripts/compare_dtek_enrichment.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VISICOM_EXPORT_PASSWORD: ${{ secrets.VISICOM_EXPORT_PASSWORD }}
