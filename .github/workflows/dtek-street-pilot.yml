name: DTEK KREM — Borodianka street directory pilot

on:
  push:
    branches: [feature/dtek-address-matching]
    paths:
      - '.github/workflows/dtek-street-pilot.yml'
      - 'scripts/export_dtek_streets.py'
      - 'scripts/match_dtek_streets.py'
      - 'scripts/test_match_dtek_streets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-streets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline street name normalization
        run: python -m unittest scripts.test_match_dtek_streets -v
      - name: Install Chromium for normal DTEK website session
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Export DTEK KREM Borodianka street directory
        run: |
          python scripts/export_dtek_streets.py \
            --output "$RUNNER_TEMP/dtek-borodianka-streets.json"
      - name: Match DTEK street names against OSM roads
        run: |
          CITY="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["city"])' "$RUNNER_TEMP/dtek-borodianka-streets.json")"
          python scripts/match_dtek_streets.py \
            --dtek "$RUNNER_TEMP/dtek-borodianka-streets.json" \
            --city "$CITY" \
            --osm data/roads.geojson \
            --output "$RUNNER_TEMP/dtek-borodianka-street-matches.json"
          python - "$RUNNER_TEMP/dtek-borodianka-street-matches.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("## DTEK KREM → OSM street names")
          print(f"Total DTEK streets: {report['totalDtekStreets']}")
          print(f"Total OSM names: {report['totalOsmStreetNames']}")
          print("| Match type | Count |")
          print("|---|---:|")
          for key, value in report["counts"].items():
              print(f"| {key} | {value} |")
          print("\nUnmatched or ambiguous names are in the uploaded JSON report.")
          PY
      - name: Upload directory and matching report (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtek-borodianka-street-pilot
          path: |
            ${{ runner.temp }}/dtek-borodianka-streets.json
            ${{ runner.temp }}/dtek-borodianka-street-matches.json
          if-no-files-found: warn
          retention-days: 7
