name: Build Static OSM Tiles → Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      min_zoom:
        description: Minimum zoom (try 13 first)
        required: true
        type: number
        default: 13
      max_zoom:
        description: Maximum zoom (try 15 for a small test)
        required: true
        type: number
        default: 19
      version:
        description: Immutable tile-set version, e.g. v1 or 2026-11
        required: true
        type: string
        default: v1
      publish:
        description: Upload resulting tiles to Cloudflare R2 (requires secrets and variables)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: static-osm-tiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MIN_ZOOM: ${{ inputs.min_zoom }}
      MAX_ZOOM: ${{ inputs.max_zoom }}
      TILE_VERSION: ${{ inputs.version }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate inputs and R2 settings
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import os, re
          a, b = int(os.environ['MIN_ZOOM']), int(os.environ['MAX_ZOOM'])
          assert 0 <= a <= b <= 19, 'Zoom range must be in 0..19'
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,49}', os.environ['TILE_VERSION']), 'Invalid version'
          if os.environ['PUBLISH'] == 'true':
              for key in ('R2_ACCOUNT_ID', 'R2_BUCKET', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY'):
                  assert os.environ.get(key), 'Missing GitHub variable or secret: ' + key
          PY

      - name: Install rasterizer and OSM extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'shapely>=2,<3' 'mercantile>=1.2,<2' 'awscli>=1.40,<3'

      - name: Offline generator smoke test (no downloads)
        run: |
          python -m py_compile scripts/build_osm_tiles.py scripts/test_osm_tiles.py
          python -m unittest scripts.test_osm_tiles -v

      - name: Download open OSM source data (not OSM raster tiles)
        run: |
          mkdir -p "$RUNNER_TEMP/osm"
          curl --fail --location --retry 4 --retry-delay 8 --output "$RUNNER_TEMP/osm/ukraine.osm.pbf" \
            https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
          test -s "$RUNNER_TEMP/osm/ukraine.osm.pbf"

      - name: Extract Borodianka and export GeoJSON sequence
        run: |
          bbox="$(python scripts/build_osm_tiles.py --print-bbox)"
          osmium extract --strategy complete_ways --bbox "$bbox" \
            "$RUNNER_TEMP/osm/ukraine.osm.pbf" -o "$RUNNER_TEMP/osm/borodianka.osm.pbf"
          osmium export --geometry-types=linestring,polygon \
            "$RUNNER_TEMP/osm/borodianka.osm.pbf" -f geojsonseq \
            -o "$RUNNER_TEMP/osm/borodianka.geojsonseq"
          test -s "$RUNNER_TEMP/osm/borodianka.geojsonseq"
          rm -f "$RUNNER_TEMP/osm/ukraine.osm.pbf"

      - name: Generate static 256px XYZ WebP tiles (no buildings)
        run: |
          python scripts/build_osm_tiles.py \
            --boundary data/boundary.geojson \
            --input "$RUNNER_TEMP/osm/borodianka.geojsonseq" \
            --out "$RUNNER_TEMP/tiles" \
            --min-zoom "$MIN_ZOOM" --max-zoom "$MAX_ZOOM"

      - name: Upload tile manifest for review
        uses: actions/upload-artifact@v4
        with:
          name: borodianka-tile-manifest
          path: ${{ runner.temp }}/tiles/manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload versioned tiles to R2
        if: inputs.publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          destination="s3://${R2_BUCKET}/borodianka/${TILE_VERSION}"
          aws s3 sync "$RUNNER_TEMP/tiles/" "$destination/" \
            --endpoint-url "$endpoint" --no-progress \
            --exclude '*' --include '*.webp' \
            --content-type image/webp \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp "$RUNNER_TEMP/tiles/manifest.json" "$destination/manifest.json" \
            --endpoint-url "$endpoint" --content-type application/json \
            --cache-control 'public, max-age=31536000, immutable'
          echo "Published: borodianka/${TILE_VERSION}/ (custom domain URL is set up in Cloudflare R2)"
