name: Update public DTEK GPV schedules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dtek-public-schedule.yml'
      - 'scripts/fetch_dtek_schedule_page.py'
      - 'scripts/fetch_dtek_gpv_schedule.py'
      - 'scripts/fetch_dtek_shared_houses.py'
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: dtek-public-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test DTEK fact normalization
        run: python -m unittest scripts.test_dtek_gpv_schedule -v
      - name: Install headless browser
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.50,<2' 'awscli>=1.40,<3'
          python -m playwright install --with-deps chromium
      - name: Capture fact from the official DTEK shutdowns page
        run: |
          python scripts/fetch_dtek_schedule_page.py --output "$RUNNER_TEMP/dtek-capture.json"
          python scripts/fetch_dtek_gpv_schedule.py --input "$RUNNER_TEMP/dtek-capture.json" --output "$RUNNER_TEMP/dtek-gpv-schedule.json"
      - name: Upload public JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtek-gpv-public
          path: ${{ runner.temp }}/dtek-gpv-schedule.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish public JSON to R2 (not encrypted)
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_BUCKET" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          aws s3 cp "$RUNNER_TEMP/dtek-gpv-schedule.json" \
            "s3://${R2_BUCKET}/borodianka/data/dtek-gpv-schedule.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress --content-type application/json \
            --cache-control 'public, max-age=300'
