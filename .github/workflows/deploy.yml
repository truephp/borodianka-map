name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Import OSM data", "DTEK KREM all Borodianka addresses vs buildings"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Include encrypted DTEK matching report on the same site
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'DTEK KREM all Borodianka addresses vs buildings' && 'dtek-borodianka-full-address-audit' || 'dtek-building-address-audit' }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'DTEK KREM all Borodianka addresses vs buildings' && github.event.workflow_run.id || 41910246449 }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dtek-review
      - name: Install DTEK report without exposing decrypted Visicom records
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/dtek-review/dtek-all-unified-matches.enc.json"
          if [ ! -s "$source" ]; then
            source="$RUNNER_TEMP/dtek-review/dtek-visicom-address-matches.enc.json"
          fi
          test -s "$source"
          cp "$source" data/dtek-all-unified-matches.enc.json
          python - <<'PY'
          import json
          with open("data/dtek-all-unified-matches.enc.json", encoding="utf-8") as f:
              envelope = json.load(f)
          assert envelope["version"] == 1 and envelope["kdf"] == "PBKDF2-SHA256"
          assert all(envelope.get(k) for k in ("salt", "iv", "data"))
          print("Encrypted DTEK review report included in GitHub Pages artifact")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
