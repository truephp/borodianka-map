name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Import OSM data", "DTEK KREM all Borodianka addresses vs buildings"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test manual OSM polygon address patching
        run: python3 -m unittest scripts.test_apply_osm_address_overrides scripts.test_match_dtek_buildings -v
      - name: Verify cumulative map patch merge and conflict checks
        run: python3 -m unittest scripts.test_build_map_patches -v
      - name: Verify administrator workflow sections
        run: node scripts/test_admin_sections.mjs
      - name: Verify building layer controls and independent house numbers
        run: node scripts/test_building_layer_controls.mjs
      - name: Verify browser cumulative master merge
        run: node scripts/test_cumulative_frontend_export.mjs
      - name: Verify combined DTEK and building patch import/export
        run: node scripts/test_combined_dtek_export.mjs
      - name: Verify DTEK details in building popups
        run: node scripts/test_dtek_building_popup.mjs
      - name: Verify outage signal classification avoids false power claims
        run: node scripts/test_dtek_outage_coloring.mjs
      - name: Verify DTEK GPV time forecast and emergency precedence
        run: node scripts/test_dtek_schedule_forecast.mjs
      - name: Verify centralized Feature patch rendering
        run: node scripts/test_feature_patch_view.mjs
      - name: Validate inline map JavaScript syntax before deployment
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline = False
                  self.buffers = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.inline = 'src' not in dict(attrs)
                      if self.inline:
                          self.buffers.append([])
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.inline = False
              def handle_data(self, data):
                  if self.inline:
                      self.buffers[-1].append(data)

          parser = InlineScripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          out = Path('/tmp/map-inline-scripts')
          out.mkdir(exist_ok=True)
          for index, buffer in enumerate(parser.buffers):
              (out / f'inline-{index}.js').write_text(''.join(buffer), encoding='utf-8')
          if not parser.buffers:
              raise SystemExit('No inline JavaScript found in index.html')
          print(f'Found {len(parser.buffers)} inline scripts')
          PY
          for file in /tmp/map-inline-scripts/*.js; do
            node --check "$file"
          done
      - name: Build corrected OSM for publication; block changed-baseline conflicts
        run: |
          cp data/buildings.geojson data/buildings.original.geojson
          python3 scripts/build_map_patches.py apply \
            --original data/buildings.original.geojson \
            --points data/address-points.geojson \
            --master data/borodianka-manual-overrides.json \
            --approvals data/borodianka-osm-approvals.json \
            --output "$RUNNER_TEMP/buildings.patched.geojson" \
            --report "$RUNNER_TEMP/osm-patch-report.json"
          cp "$RUNNER_TEMP/buildings.patched.geojson" data/buildings.geojson
      - name: Find latest successful full DTEK report
        id: dtek-run
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowId = 'dtek-all-addresses.yml';
            const response = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: workflowId, status: 'success', per_page: 20
            });
            const run = response.data.workflow_runs.find(run =>
              run.head_branch === 'main' && run.conclusion === 'success'
            );
            if (!run) {
              core.setFailed('No successful full DTEK report workflow run on main');
              return;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id, per_page: 100
            });
            const artifact = artifacts.data.artifacts.find(a =>
              a.name === 'dtek-borodianka-full-address-audit' && !a.expired
            );
            if (!artifact) {
              core.setFailed('Latest successful full DTEK run has no non-expired encrypted report artifact');
              return;
            }
            core.setOutput('run-id', String(run.id));
            core.info('Using full DTEK report from workflow run ' + run.id);
      - name: Include encrypted DTEK matching report on the same site
        uses: actions/download-artifact@v4
        with:
          name: dtek-borodianka-full-address-audit
          run-id: ${{ steps.dtek-run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dtek-review
      - name: Install DTEK report without exposing decrypted Visicom records
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/dtek-review/dtek-all-unified-matches.enc.json"
          if [ ! -s "$source" ]; then
            source="$RUNNER_TEMP/dtek-review/dtek-visicom-address-matches.enc.json"
          fi
          test -s "$source"
          cp "$source" data/dtek-all-unified-matches.enc.json
          schedule="$RUNNER_TEMP/dtek-review/dtek-gpv-schedule.json"
          if [ -s "$schedule" ] && python - "$schedule" <<'PY'
          import json, sys
          from pathlib import Path
          try:
              schedule=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              valid=(schedule.get("schemaVersion")==1 and
                     schedule.get("source")=="https://www.dtek-krem.com.ua/ua/shutdowns" and
                     bool(schedule.get("days")))
          except Exception:
              valid=False
          sys.exit(0 if valid else 1)
          PY
          then
            cp "$schedule" data/dtek-gpv-schedule.json
            echo "First-party DTEK fact schedule published to Pages"
          else
            echo "::warning::First-party fact schedule not in latest DTEK artifact; omit forecast until next valid capture."
          fi
          python - <<'PY'
          import json
          with open("data/dtek-all-unified-matches.enc.json", encoding="utf-8") as f:
              envelope = json.load(f)
          assert envelope["version"] == 1 and envelope["kdf"] == "PBKDF2-SHA256"
          assert all(envelope.get(k) for k in ("salt", "iv", "data"))
          print("Encrypted DTEK review report included in GitHub Pages artifact")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
