name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Import OSM data", "DTEK KREM all Borodianka addresses vs buildings"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Find latest successful full DTEK report
        id: dtek-run
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowId = 'dtek-all-addresses.yml';
            const response = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: workflowId, status: 'success', per_page: 20
            });
            const run = response.data.workflow_runs.find(run =>
              run.head_branch === 'main' && run.conclusion === 'success'
            );
            if (!run) {
              core.setFailed('No successful full DTEK report workflow run on main');
              return;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id, per_page: 100
            });
            const artifact = artifacts.data.artifacts.find(a =>
              a.name === 'dtek-borodianka-full-address-audit' && !a.expired
            );
            if (!artifact) {
              core.setFailed('Latest successful full DTEK run has no non-expired encrypted report artifact');
              return;
            }
            core.setOutput('run-id', String(run.id));
            core.info('Using full DTEK report from workflow run ' + run.id);
      - name: Include encrypted DTEK matching report on the same site
        uses: actions/download-artifact@v4
        with:
          name: dtek-borodianka-full-address-audit
          run-id: ${{ steps.dtek-run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dtek-review
      - name: Install DTEK report without exposing decrypted Visicom records
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/dtek-review/dtek-all-unified-matches.enc.json"
          if [ ! -s "$source" ]; then
            source="$RUNNER_TEMP/dtek-review/dtek-visicom-address-matches.enc.json"
          fi
          test -s "$source"
          cp "$source" data/dtek-all-unified-matches.enc.json
          python - <<'PY'
          import json
          with open("data/dtek-all-unified-matches.enc.json", encoding="utf-8") as f:
              envelope = json.load(f)
          assert envelope["version"] == 1 and envelope["kdf"] == "PBKDF2-SHA256"
          assert all(envelope.get(k) for k in ("salt", "iv", "data"))
          print("Encrypted DTEK review report included in GitHub Pages artifact")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
