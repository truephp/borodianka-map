name: DTEK KREM all Borodianka addresses vs buildings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dtek-all-addresses.yml'
      - 'scripts/fetch_dtek_shared_houses.py'
      - 'scripts/match_dtek_buildings.py'
      - 'scripts/test_match_dtek_buildings.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test DTEK normalizers
        run: python -m unittest scripts.test_match_dtek_buildings scripts.test_compare_dtek_shared_houses -v
      - name: Install browser and libraries
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.50,<2' 'cryptography>=43,<47' 'shapely>=2,<3' 'awscli>=1.40,<3'
          python -m playwright install --with-deps chromium
      - name: Fetch all settlement/street pairs at conservative pace
        id: dtek
        continue-on-error: true
        env:
          DTEK_FACT: '04.11.2026 20:36'
        run: |
          python scripts/fetch_dtek_shared_houses.py \
            --all-streets \
            --delay-seconds 1.5 \
            --update-fact "$DTEK_FACT" \
            --output "$RUNNER_TEMP/dtek-borodianka-all-houses.json"
      - name: Match public OSM building addresses
        if: always()
        id: osm
        continue-on-error: true
        run: |
          test -s "$RUNNER_TEMP/dtek-borodianka-all-houses.json"
          python scripts/match_dtek_buildings.py \
            --dtek "$RUNNER_TEMP/dtek-borodianka-all-houses.json" \
            --output "$RUNNER_TEMP/dtek-all-osm-matches.json" \
            --summary "$RUNNER_TEMP/dtek-all-osm-summary.json"
      - name: Download encrypted unified buildings (read-only)
        if: always() && steps.osm.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_BUCKET"
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          aws s3 cp "s3://${R2_BUCKET}/borodianka/data/borodianka-buildings.enc.json" \
            "$RUNNER_TEMP/borodianka-buildings.enc.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
      - name: Match private unified buildings, encrypted result
        if: always() && steps.osm.outcome == 'success'
        id: visicom
        continue-on-error: true
        env:
          VISICOM_EXPORT_PASSWORD: ${{ secrets.VISICOM_EXPORT_PASSWORD }}
        run: |
          python scripts/match_dtek_buildings.py \
            --dtek "$RUNNER_TEMP/dtek-borodianka-all-houses.json" \
            --visicom-encrypted "$RUNNER_TEMP/borodianka-buildings.enc.json" \
            --output "$RUNNER_TEMP/dtek-all-unified-matches.enc.json" \
            --summary "$RUNNER_TEMP/dtek-all-unified-summary.json"
      - name: Summarize all streets
        if: always()
        run: |
          python - "$RUNNER_TEMP" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          print("## Бородянка: ДТЕК → OSM і зашифрований Visicom")
          data = base / "dtek-borodianka-all-houses.json"
          if data.exists():
              responses = json.loads(data.read_text())["responses"]
              print(f"Запитів: {len(responses)}; успішних: {sum('response' in r for r in responses)}; помилок: {sum('error' in r for r in responses)}")
          names = ["dtek-all-osm-summary.json", "dtek-all-unified-summary.json"]
          for name in names:
              f=base/name
              if not f.exists(): continue
              summary=json.loads(f.read_text())
              print(f"\n### {name}")
              print(f"Адрес ДТЕК: {summary['dtekAddressCount']}; помилок джерела: {summary['sourceErrors']}")
              print("| Категорія | Кількість |\n|---|---:|")
              for key, value in summary["counts"].items():
                  print(f"| {key} | {value} |")
          print("\nVisicom details stay encrypted. Street-house candidates require manual review.")
          PY
      - name: Upload source house keys, public OSM result and encrypted Visicom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtek-borodianka-full-address-audit
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dtek-borodianka-all-houses.json
            ${{ runner.temp }}/dtek-all-osm-matches.json
            ${{ runner.temp }}/dtek-all-osm-summary.json
            ${{ runner.temp }}/dtek-all-unified-matches.enc.json
            ${{ runner.temp }}/dtek-all-unified-summary.json
      - name: Mark incomplete run
        if: always()
        run: |
          test "${{ steps.dtek.outcome }}" = success
          test "${{ steps.osm.outcome }}" = success
          test "${{ steps.visicom.outcome }}" = success
