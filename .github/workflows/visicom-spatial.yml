name: Test Visicom Spatial Discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Discover all address IDs and encrypt index
        env:
          VISICOM_API_KEY: ${{ secrets.VISICOM_API_KEY }}
          VISICOM_EXPORT_PASSWORD: ${{ secrets.VISICOM_EXPORT_PASSWORD }}
          VISICOM_EXPORT_PATH: ${{ runner.temp }}/visicom/visicom-address-index.enc.json
          VISICOM_MAX_CELLS: '1500'
          VISICOM_IDS_ONLY: '1'
          VISICOM_MAX_FEATURES: '0'
        run: node scripts/visicom-spatial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visicom-address-index
          path: ${{ runner.temp }}/visicom/visicom-address-index.enc.json
          retention-days: 1
          if-no-files-found: error
