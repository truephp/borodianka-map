name: Build Unified Visicom + OSM Buildings
on:
  workflow_dispatch:
    inputs:
      visicom_run_id:
        description: Optional Visicom Full Feature Export run ID; empty = load archived encrypted file from R2
        required: false
        default: ''
        type: string
      confident_iou:
        description: Hide OSM when IoU is at least this value
        required: true
        default: '0.35'
        type: string
      overlap_threshold:
        description: Hide OSM when smaller-contour overlap reaches this value
        required: true
        default: '0.80'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry and encryption libraries
        run: python -m pip install --disable-pip-version-check 'shapely>=2,<3' 'cryptography>=43,<47'
      - name: Test encrypted merge and geometry rules
        run: python -m unittest scripts.test_merge_buildings -v
      - name: Reuse existing encrypted Visicom export
        if: inputs.visicom_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: visicom-buildings
          run-id: ${{ inputs.visicom_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visicom-source
      - name: Download encrypted Visicom export from R2 (no Visicom API calls)
        if: inputs.visicom_run_id == ''
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_BUCKET" || { echo 'R2 variables missing'; exit 1; }
          python -m pip install --disable-pip-version-check 'awscli>=1.40,<3'
          mkdir -p "$RUNNER_TEMP/visicom-source"
          aws s3 cp "s3://${R2_BUCKET}/borodianka/source/visicom-buildings.enc.json" \
            "$RUNNER_TEMP/visicom-source/visicom-buildings.enc.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
          test -s "$RUNNER_TEMP/visicom-source/visicom-buildings.enc.json"
      - name: Merge and encrypt unified buildings (do not commit Visicom data)
        env:
          VISICOM_EXPORT_PASSWORD: ${{ secrets.VISICOM_EXPORT_PASSWORD }}
          IOU: ${{ inputs.confident_iou }}
          OVERLAP: ${{ inputs.overlap_threshold }}
        run: |
          python -m py_compile scripts/merge_buildings.py
          python scripts/merge_buildings.py \
            --visicom "$RUNNER_TEMP/visicom-source/visicom-buildings.enc.json" \
            --osm data/buildings.geojson --boundary data/boundary.geojson \
            --iou "$IOU" --overlap "$OVERLAP" \
            --output "$RUNNER_TEMP/unified/borodianka-buildings.enc.json"
      - name: Publish encrypted GeoJSON directly to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_BUCKET" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'Missing R2 configuration'; exit 1; }
          python -m pip install --disable-pip-version-check 'awscli>=1.40,<3'
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          source="$RUNNER_TEMP/unified/borodianka-buildings.enc.json"
          key="borodianka/data/borodianka-buildings.enc.json"
          aws s3 cp "$source" "s3://${R2_BUCKET}/${key}" \
            --endpoint-url "$endpoint" --no-progress \
            --content-type 'application/json' \
            --cache-control 'public, max-age=60, must-revalidate'
          aws s3 cp "s3://${R2_BUCKET}/${key}" "$RUNNER_TEMP/verify-buildings.enc.json" \
            --endpoint-url "$endpoint" --no-progress
          cmp --silent "$source" "$RUNNER_TEMP/verify-buildings.enc.json"
          echo "Published and verified encrypted GeoJSON in R2: ${key}"
      - name: Upload encrypted unified buildings for map
        uses: actions/upload-artifact@v4
        with:
          name: borodianka-unified-buildings
          path: ${{ runner.temp }}/unified/borodianka-buildings.enc.json
          retention-days: 7
          if-no-files-found: error
