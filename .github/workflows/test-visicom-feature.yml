name: Test Visicom Feature Geometry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check geometry types of 10 Visicom address features
        env:
          VISICOM_API_KEY: ${{ secrets.VISICOM_API_KEY }}
        run: node scripts/test-visicom-feature.mjs
