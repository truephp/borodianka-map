name: Publish Dnipro OSM building contours → R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dnipro-buildings.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Dnipro tile generation run with dnipro-osm-prepared
        required: true
        default: '42782720679'
        type: string
      version:
        description: R2 dataset version
        required: true
        default: v1
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: ${{ github.event_name == 'push' && '42782720679' || inputs.source_run_id }}
      TILE_VERSION: ${{ github.event_name == 'push' && 'v1' || inputs.version }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: dnipro-osm-prepared
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
      - name: Install geometry and S3 tools
        run: python -m pip install --disable-pip-version-check 'shapely>=2,<3' 'mercantile>=1.2,<2' 'awscli>=1.40,<3'
      - name: Export OSM building contours into zoom 15 GeoJSON tiles
        run: |
          test -s "$RUNNER_TEMP/prepared/dnipro.geojsonseq"
          test -s "$RUNNER_TEMP/prepared/boundary.geojson"
          python scripts/export_dnipro_buildings.py \
            --input "$RUNNER_TEMP/prepared/dnipro.geojsonseq" \
            --boundary "$RUNNER_TEMP/prepared/boundary.geojson" \
            --out "$RUNNER_TEMP/buildings" --zoom 15
          cat "$RUNNER_TEMP/buildings/manifest.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish building tiles to R2 (manifest last)
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          assert re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9._-]{0,49}',os.environ['TILE_VERSION'])
          for key in ('R2_ACCOUNT_ID','R2_BUCKET','AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY'):
              assert os.environ.get(key), 'Missing '+key
          PY
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          destination="s3://${R2_BUCKET}/dnipro/${TILE_VERSION}/buildings"
          aws s3 sync "$RUNNER_TEMP/buildings/" "$destination/" \
            --endpoint-url "$endpoint" --no-progress \
            --exclude '*' --include '*.geojson' \
            --content-type application/geo+json \
            --cache-control 'public, max-age=3600'
          aws s3 cp "$RUNNER_TEMP/buildings/manifest.json" "$destination/manifest.json" \
            --endpoint-url "$endpoint" --no-progress \
            --content-type application/json --cache-control 'public, max-age=3600'
      - uses: actions/upload-artifact@v4
        with:
          name: dnipro-osm-building-manifest
          path: ${{ runner.temp }}/buildings/manifest.json
          retention-days: 14
